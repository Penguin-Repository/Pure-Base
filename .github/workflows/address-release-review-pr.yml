name: Apply release review fixes

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/address-release-review-pr.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/include-release-package-metadata'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - shell: python
        run: |
          from pathlib import Path
          p = Path('Tests/Release/Run-PureBaseReleaseValidation.ps1')
          s = p.read_text(encoding='utf-8')
          package_metas = [
              "'_LocalPackages/jp.penguin.purebase/Editor.meta'",
              "'_LocalPackages/jp.penguin.purebase/LICENSE.meta'",
              "'_LocalPackages/jp.penguin.purebase/NOTICE.meta'",
              "'_LocalPackages/jp.penguin.purebase/README.md.meta'",
              "'_LocalPackages/jp.penguin.purebase/Shaders.meta'",
              "'_LocalPackages/jp.penguin.purebase/package.json.meta'",
          ]
          start = s.index('function Get-ExpectedFirstBootstrapAddedPaths')
          end = s.index('function Get-ExpectedFirstBootstrapChangedPaths', start)
          block = s[start:end]
          for token in package_metas:
              block = block.replace(', ' + token, '').replace(token + ', ', '').replace(token, '')
          while ',\n    )' in block:
              block = block.replace(',\n    )', '\n    )')
          s = s[:start] + block + s[end:]
          start = s.index('function Get-FirstBootstrapGeneratedMetaProfile')
          end = s.index('function Get-FirstBootstrapPackageProfile', start)
          block = s[start:end]
          block = '\n'.join(line for line in block.splitlines() if not any(token in line for token in package_metas)) + '\n\n'
          s = s[:start] + block + s[end:]
          p.write_text(s, encoding='utf-8', newline='\n')

          t = Path('Tests/Release/Run-PureBaseReleaseValidation.Tests.ps1')
          q = t.read_text(encoding='utf-8')
          marker = 'function Assert-HarnessSemanticRejection {\n'
          regression = """$preStagedPureBaseMetaPaths = @(
              '_LocalPackages/jp.penguin.purebase/CHANGELOG.meta',
              '_LocalPackages/jp.penguin.purebase/Editor.meta',
              '_LocalPackages/jp.penguin.purebase/LICENSE.meta',
              '_LocalPackages/jp.penguin.purebase/NOTICE.meta',
              '_LocalPackages/jp.penguin.purebase/README.md.meta',
              '_LocalPackages/jp.penguin.purebase/Shaders.meta',
              '_LocalPackages/jp.penguin.purebase/package.json.meta'
          )
          $expectedFirstBootstrapAddedPaths = @(Get-ExpectedFirstBootstrapAddedPaths)
          $firstBootstrapGeneratedMetaProfile = Get-FirstBootstrapGeneratedMetaProfile
          foreach ($path in $preStagedPureBaseMetaPaths) {
              Assert-Harness -Condition ($expectedFirstBootstrapAddedPaths -notcontains $path) -Message "Pre-staged PureBase meta remains classified as a first-bootstrap addition: '$path'."
              Assert-Harness -Condition (-not $firstBootstrapGeneratedMetaProfile.Contains($path)) -Message "Pre-staged PureBase meta remains classified as Unity-generated: '$path'."
          }

          """
          if '$preStagedPureBaseMetaPaths = @(' not in q:
              if q.count(marker) != 1:
                  raise SystemExit('Test insertion marker mismatch')
              q = q.replace(marker, regression + marker)
          t.write_text(q, encoding='utf-8', newline='\n')
      - shell: bash
        run: |
          rm .github/workflows/address-release-review.yml .github/workflows/address-release-review-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix release bootstrap metadata expectations'
          git push origin HEAD:agent/include-release-package-metadata
