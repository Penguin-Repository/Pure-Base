name: Address release review feedback

on:
  push:
    branches:
      - agent/include-release-package-metadata
    paths:
      - .github/workflows/address-release-review.yml

permissions:
  contents: write

jobs:
  update-bootstrap-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/include-release-package-metadata
          fetch-depth: 0

      - name: Update bootstrap metadata expectations
        shell: python
        run: |
          from pathlib import Path

          runner_path = Path("Tests/Release/Run-PureBaseReleaseValidation.ps1")
          runner = runner_path.read_text(encoding="utf-8")

          old_added_tail = """        'ProjectSettings/AudioManager.asset', 'ProjectSettings/ClusterInputManager.asset', 'ProjectSettings/DynamicsManager.asset', 'ProjectSettings/EditorBuildSettings.asset', 'ProjectSettings/EditorSettings.asset', 'ProjectSettings/GraphicsSettings.asset', 'ProjectSettings/InputManager.asset', 'ProjectSettings/MemorySettings.asset', 'ProjectSettings/NavMeshAreas.asset', 'ProjectSettings/Physics2DSettings.asset', 'ProjectSettings/PresetManager.asset', 'ProjectSettings/ProjectSettings.asset', 'ProjectSettings/SceneTemplateSettings.json', 'ProjectSettings/TagManager.asset', 'ProjectSettings/TimeManager.asset', 'ProjectSettings/UnityConnectSettings.asset', 'ProjectSettings/VFXManager.asset', 'ProjectSettings/VersionControlSettings.asset', 'ProjectSettings/jp.lilxyzw.shadercore.asset',
          '_LocalPackages/jp.penguin.purebase/Editor.meta', '_LocalPackages/jp.penguin.purebase/LICENSE.meta', '_LocalPackages/jp.penguin.purebase/NOTICE.meta', '_LocalPackages/jp.penguin.purebase/README.md.meta', '_LocalPackages/jp.penguin.purebase/Shaders.meta', '_LocalPackages/jp.penguin.purebase/package.json.meta'
          """
          new_added_tail = """        'ProjectSettings/AudioManager.asset', 'ProjectSettings/ClusterInputManager.asset', 'ProjectSettings/DynamicsManager.asset', 'ProjectSettings/EditorBuildSettings.asset', 'ProjectSettings/EditorSettings.asset', 'ProjectSettings/GraphicsSettings.asset', 'ProjectSettings/InputManager.asset', 'ProjectSettings/MemorySettings.asset', 'ProjectSettings/NavMeshAreas.asset', 'ProjectSettings/Physics2DSettings.asset', 'ProjectSettings/PresetManager.asset', 'ProjectSettings/ProjectSettings.asset', 'ProjectSettings/SceneTemplateSettings.json', 'ProjectSettings/TagManager.asset', 'ProjectSettings/TimeManager.asset', 'ProjectSettings/UnityConnectSettings.asset', 'ProjectSettings/VFXManager.asset', 'ProjectSettings/VersionControlSettings.asset', 'ProjectSettings/jp.lilxyzw.shadercore.asset'
          """
          if runner.count(old_added_tail) != 1:
              raise SystemExit("Expected first-bootstrap added-path tail was not found exactly once.")
          runner = runner.replace(old_added_tail, new_added_tail)

          pre_staged_profile_lines = (
              "        '_LocalPackages/jp.penguin.purebase/Editor.meta'       = [ordered]@{ relatedPath = '_LocalPackages/jp.penguin.purebase/Editor'; itemType = 'Directory' }\n",
              "        '_LocalPackages/jp.penguin.purebase/LICENSE.meta'      = [ordered]@{ relatedPath = '_LocalPackages/jp.penguin.purebase/LICENSE'; itemType = 'Leaf' }\n",
              "        '_LocalPackages/jp.penguin.purebase/NOTICE.meta'       = [ordered]@{ relatedPath = '_LocalPackages/jp.penguin.purebase/NOTICE'; itemType = 'Leaf' }\n",
              "        '_LocalPackages/jp.penguin.purebase/README.md.meta'    = [ordered]@{ relatedPath = '_LocalPackages/jp.penguin.purebase/README.md'; itemType = 'Leaf' }\n",
              "        '_LocalPackages/jp.penguin.purebase/Shaders.meta'      = [ordered]@{ relatedPath = '_LocalPackages/jp.penguin.purebase/Shaders'; itemType = 'Directory' }\n",
              "        '_LocalPackages/jp.penguin.purebase/package.json.meta' = [ordered]@{ relatedPath = '_LocalPackages/jp.penguin.purebase/package.json'; itemType = 'Leaf' }\n",
          )
          for line in pre_staged_profile_lines:
              if runner.count(line) != 1:
                  raise SystemExit(f"Expected generated-meta profile line was not found exactly once: {line.strip()}")
              runner = runner.replace(line, "")

          runner_path.write_text(runner, encoding="utf-8", newline="\n")

          tests_path = Path("Tests/Release/Run-PureBaseReleaseValidation.Tests.ps1")
          tests = tests_path.read_text(encoding="utf-8")
          marker = "function Assert-HarnessSemanticRejection {\n"
          if tests.count(marker) != 1:
              raise SystemExit("Runner harness insertion marker was not found exactly once.")
          regression = """$preStagedPureBaseMetaPaths = @(
              '_LocalPackages/jp.penguin.purebase/CHANGELOG.meta',
              '_LocalPackages/jp.penguin.purebase/Editor.meta',
              '_LocalPackages/jp.penguin.purebase/LICENSE.meta',
              '_LocalPackages/jp.penguin.purebase/NOTICE.meta',
              '_LocalPackages/jp.penguin.purebase/README.md.meta',
              '_LocalPackages/jp.penguin.purebase/Shaders.meta',
              '_LocalPackages/jp.penguin.purebase/package.json.meta'
          )
          $expectedFirstBootstrapAddedPaths = @(Get-ExpectedFirstBootstrapAddedPaths)
          $firstBootstrapGeneratedMetaProfile = Get-FirstBootstrapGeneratedMetaProfile
          foreach ($path in $preStagedPureBaseMetaPaths) {
              Assert-Harness -Condition ($expectedFirstBootstrapAddedPaths -notcontains $path) -Message "Pre-staged PureBase meta remains classified as a first-bootstrap addition: '$path'."
              Assert-Harness -Condition (-not $firstBootstrapGeneratedMetaProfile.Contains($path)) -Message "Pre-staged PureBase meta remains classified as Unity-generated: '$path'."
          }

          """
          tests = tests.replace(marker, regression + marker)
          tests_path.write_text(tests, encoding="utf-8", newline="\n")

      - name: Verify patched contracts
        shell: python
        run: |
          from pathlib import Path

          runner = Path("Tests/Release/Run-PureBaseReleaseValidation.ps1").read_text(encoding="utf-8")
          tests = Path("Tests/Release/Run-PureBaseReleaseValidation.Tests.ps1").read_text(encoding="utf-8")
          pre_staged = (
              "_LocalPackages/jp.penguin.purebase/CHANGELOG.meta",
              "_LocalPackages/jp.penguin.purebase/Editor.meta",
              "_LocalPackages/jp.penguin.purebase/LICENSE.meta",
              "_LocalPackages/jp.penguin.purebase/NOTICE.meta",
              "_LocalPackages/jp.penguin.purebase/README.md.meta",
              "_LocalPackages/jp.penguin.purebase/Shaders.meta",
              "_LocalPackages/jp.penguin.purebase/package.json.meta",
          )
          added_start = runner.index("function Get-ExpectedFirstBootstrapAddedPaths")
          changed_start = runner.index("function Get-ExpectedFirstBootstrapChangedPaths", added_start)
          added_section = runner[added_start:changed_start]
          profile_start = runner.index("function Get-FirstBootstrapGeneratedMetaProfile")
          package_start = runner.index("function Get-FirstBootstrapPackageProfile", profile_start)
          profile_section = runner[profile_start:package_start]
          for path in pre_staged:
              if path in added_section or path in profile_section:
                  raise SystemExit(f"Pre-staged meta remains in a Unity-generated bootstrap contract: {path}")
              if path not in tests:
                  raise SystemExit(f"Regression harness omits pre-staged meta: {path}")

      - name: Commit review fixes
        shell: bash
        run: |
          rm .github/workflows/address-release-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tests/Release/Run-PureBaseReleaseValidation.ps1 Tests/Release/Run-PureBaseReleaseValidation.Tests.ps1 .github/workflows/address-release-review.yml
          git commit -m "Fix release bootstrap metadata expectations"
          git push origin HEAD:agent/include-release-package-metadata
