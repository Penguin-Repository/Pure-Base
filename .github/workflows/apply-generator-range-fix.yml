# One-shot trusted maintenance workflow. It applies exact semantic replacements and removes itself.
name: Apply generator range fix

on:
  pull_request:
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/use-github-hosted-unity'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/use-github-hosted-unity
          fetch-depth: 0

      - name: Apply validated generator replacements
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("Tests/Regeneration/Editor/PureBaseRegressionBaselineGenerator.cs")
          source = path.read_text(encoding="utf-8")

          comparison_pattern = re.compile(
              r"(?m)^(?P<indent>\s*)\|\| baseline\.shadowChangedPixelCount != observation\.shadowChangedPixelCount\s*\n"
              r"(?P=indent)\|\| baseline\.warmedVariantCount != observation\.warmedVariantCount$"
          )
          comparison_replacement = (
              r"\g<indent>// A freshly regenerated baseline must remain exact until a reviewer\n"
              r"\g<indent>// explicitly approves a renderer-specific tolerance range.\n"
              r"\g<indent>|| baseline.shadowChangedPixelCount == null\n"
              r"\g<indent>|| baseline.shadowChangedPixelCount.minimum\n"
              r"\g<indent>    != observation.shadowChangedPixelCount\n"
              r"\g<indent>|| baseline.shadowChangedPixelCount.maximum\n"
              r"\g<indent>    != observation.shadowChangedPixelCount\n"
              r"\g<indent>|| baseline.warmedVariantCount != observation.warmedVariantCount"
          )
          source, comparison_count = comparison_pattern.subn(
              comparison_replacement,
              source,
              count=1,
          )
          if comparison_count != 1:
              raise RuntimeError(
                  f"Expected one legacy shadow comparison, replaced {comparison_count}."
              )

          assignment_pattern = re.compile(
              r"candidate\.exactBaseline\.shadowChangedPixelCount\s*=\s*0\s*;"
          )
          source, assignment_count = assignment_pattern.subn(
              "candidate.exactBaseline.shadowChangedPixelCount = IntRange.Exact(0);",
              source,
              count=1,
          )
          if assignment_count != 1:
              raise RuntimeError(
                  f"Expected one legacy zero-shadow assignment, replaced {assignment_count}."
              )

          path.write_text(source, encoding="utf-8", newline="\n")

      - name: Verify no legacy generator references remain
        shell: bash
        run: |
          ! grep -nE 'shadowChangedPixelCount[[:space:]]*!=[[:space:]]*observation\.shadowChangedPixelCount' Tests/Regeneration/Editor/PureBaseRegressionBaselineGenerator.cs
          ! grep -nE 'exactBaseline\.shadowChangedPixelCount[[:space:]]*=[[:space:]]*0[[:space:]]*;' Tests/Regeneration/Editor/PureBaseRegressionBaselineGenerator.cs

      - name: Remove one-shot workflow
        run: git rm .github/workflows/apply-generator-range-fix.yml

      - name: Commit generator range fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tests/Regeneration/Editor/PureBaseRegressionBaselineGenerator.cs
          git diff --cached --check
          git commit -m "Update baseline generator for shadow ranges"
          git push origin HEAD:agent/use-github-hosted-unity
