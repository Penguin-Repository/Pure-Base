# One-shot trusted maintenance workflow. It adds successful Daily observation logging and removes itself.
name: Apply shadow observation log

on:
  pull_request:
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/use-github-hosted-unity'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/use-github-hosted-unity
          fetch-depth: 0

      - name: Add successful shadow observation logging
        shell: python
        run: |
          from pathlib import Path

          path = Path("Tests/Daily/Editor/PureBaseValidationSceneRegressionTests.cs")
          source = path.read_text(encoding="utf-8")
          old = """                SceneRegressionObservation observation = CaptureObservation(validationScene);
                AssertObservationMatchesBaseline(observation, baseline);"""
          new = """                SceneRegressionObservation observation = CaptureObservation(validationScene);
                // Keep successful runs measurable so reviewers can determine whether the
                // cross-renderer shadow range is still necessary after local and CI quality
                // settings have been aligned.
                int qualityLevel = QualitySettings.GetQualityLevel();
                string qualityName =
                    qualityLevel >= 0 && qualityLevel < QualitySettings.names.Length
                        ? QualitySettings.names[qualityLevel]
                        : \"<invalid>\";
                Debug.Log(
                    $\"Pure-Base Daily shadow observation: changedPixels={observation.shadowChangedPixelCount}, \"
                        + $\"reviewedRange=[{baseline.shadowChangedPixelCount.minimum}, {baseline.shadowChangedPixelCount.maximum}], \"
                        + $\"graphicsDevice='{SystemInfo.graphicsDeviceName}', graphicsDeviceType={SystemInfo.graphicsDeviceType}, \"
                        + $\"qualityLevel={qualityLevel} ('{qualityName}').\"
                );
                AssertObservationMatchesBaseline(observation, baseline);"""

          count = source.count(old)
          if count != 1:
              raise RuntimeError(f"Expected exactly one observation insertion point, found {count}.")
          path.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")

      - name: Verify observation log
        shell: bash
        run: |
          grep -nF 'Pure-Base Daily shadow observation:' Tests/Daily/Editor/PureBaseValidationSceneRegressionTests.cs
          git diff --check

      - name: Remove one-shot workflow
        run: git rm .github/workflows/apply-shadow-observation-log.yml

      - name: Commit observation logging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tests/Daily/Editor/PureBaseValidationSceneRegressionTests.cs
          git diff --cached --check
          git commit -m "Log successful Daily shadow observations"
          git push origin HEAD:agent/use-github-hosted-unity
