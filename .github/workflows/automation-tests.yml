name: Automation tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automation-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  finalize-release-review-fix:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/include-release-package-metadata'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Remove dangling array comma
        shell: python
        run: |
          from pathlib import Path
          path = Path('Tests/Release/Run-PureBaseReleaseValidation.ps1')
          source = path.read_text(encoding='utf-8')
          old = "'ProjectSettings/VersionControlSettings.asset', 'ProjectSettings/jp.lilxyzw.shadercore.asset',\n        \n    )"
          new = "'ProjectSettings/VersionControlSettings.asset', 'ProjectSettings/jp.lilxyzw.shadercore.asset'\n    )"
          if source.count(old) != 1:
              raise SystemExit('Expected dangling-comma sequence was not found exactly once.')
          path.write_text(source.replace(old, new), encoding='utf-8', newline='\n')
      - name: Restore workflow and commit
        shell: bash
        run: |
          git show origin/master:.github/workflows/automation-tests.yml > .github/workflows/automation-tests.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Tests/Release/Run-PureBaseReleaseValidation.ps1 .github/workflows/automation-tests.yml
          git commit -m 'Fix release bootstrap metadata array syntax'
          git push origin HEAD:agent/include-release-package-metadata

  pester:
    name: Pester 5.9.0
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.9.0 -Scope CurrentUser -Force

      - name: Run automation tests
        shell: pwsh
        run: |
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = '.github/tests'
          $configuration.Run.Exit = $true
          $configuration.Output.Verbosity = 'Detailed'
          $configuration.Output.CIFormat = 'GithubActions'
          $configuration.TestResult.Enabled = $true
          $configuration.TestResult.OutputFormat = 'NUnitXml'
          $configuration.TestResult.OutputPath = 'TestResults/Pester.NUnit.xml'
          New-Item -ItemType Directory -Path TestResults -Force | Out-Null
          Invoke-Pester -Configuration $configuration

      - name: Upload Pester results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pure-base-pester-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/Pester.NUnit.xml
          if-no-files-found: warn
          retention-days: 14

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
