name: Apply Codacy fixes

on:
  push:
    branches:
      - agent/fix-draft-release-reread

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/fix-draft-release-reread
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Use named Invoke-Api parameters
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/scripts/Invoke-PureBaseRelease.ps1')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'try { return Invoke-Api GET "$apiRoot/repos/$Repository/releases/$ReleaseId" $releaseToken }':
                  'try { return Invoke-Api -Method GET -Uri "$apiRoot/repos/$Repository/releases/$ReleaseId" -Token $releaseToken }',
              '$createdRelease = Invoke-Api POST "$apiRoot/repos/$Repository/releases" $releaseToken ([ordered]@{ tag_name = $ConfirmedVersion; target_commitish = $ValidatedEventSha; name = $ConfirmedVersion; body = $badge; draft = $true; prerelease = [bool]$releaseMode.PrereleaseKind; generate_release_notes = $true })':
                  '$createdRelease = Invoke-Api -Method POST -Uri "$apiRoot/repos/$Repository/releases" -Token $releaseToken -Body ([ordered]@{ tag_name = $ConfirmedVersion; target_commitish = $ValidatedEventSha; name = $ConfirmedVersion; body = $badge; draft = $true; prerelease = [bool]$releaseMode.PrereleaseKind; generate_release_notes = $true })',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence, found {count}: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='')

      - name: Restore normal automation workflow
        shell: bash
        run: git show origin/master:.github/workflows/automation-tests.yml > .github/workflows/automation-tests.yml

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.9.0 -Scope CurrentUser -Force

      - name: Run automation tests
        shell: pwsh
        run: |
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = '.github/tests'
          $configuration.Run.Exit = $true
          $configuration.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $configuration

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/scripts/Invoke-PureBaseRelease.ps1 .github/workflows/automation-tests.yml
          git commit -m "Use named Invoke-Api parameters"
          git push origin HEAD:agent/fix-draft-release-reread
