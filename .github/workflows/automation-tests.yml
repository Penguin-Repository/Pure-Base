name: Apply resume target fix

on:
  push:
    branches:
      - agent/fix-resume-release-target

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Checkout fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/fix-resume-release-target
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Apply controller and release target separation
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match in {path}, found {count}: {old[:140]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='')

          def sub_once(path: Path, pattern: str, replacement: str) -> None:
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE | re.DOTALL)
              if count != 1:
                  raise SystemExit(f'Expected one regex match in {path}, found {count}: {pattern[:140]!r}')
              path.write_text(updated, encoding='utf-8', newline='')

          # Construct Actions expressions at runtime so the workflow engine does not
          # expand expressions that are intended to be written into repository files.
          def expr(name: str) -> str:
              return '$' + '{{ ' + name + ' }}'

          script = Path('.github/scripts/Invoke-PureBaseRelease.ps1')
          workflow = Path('.github/workflows/release.yml')
          contracts = Path('.github/tests/HostedUnityReviewContracts.Tests.ps1')
          tests = Path('.github/tests/PureBase.Automation.Tests.ps1')

          replace_once(
              script,
              "    [Parameter()][scriptblock]$BeforeMutation,\n    [Parameter()][switch]$Resume,",
              "    [Parameter()][scriptblock]$BeforeMutation,\n    [Parameter()][string]$ControllerSha = '',\n    [Parameter()][switch]$Resume,",
          )
          replace_once(
              script,
              "if ($ValidatedEventSha -notmatch '^[0-9a-fA-F]{40}$') { throw 'ValidatedEventSha must be a full Git SHA.' }\n",
              "if ($ValidatedEventSha -notmatch '^[0-9a-fA-F]{40}$') { throw 'ValidatedEventSha must be a full Git SHA.' }\nif ([string]::IsNullOrWhiteSpace($ControllerSha)) { $ControllerSha = $ValidatedEventSha }\nif ($ControllerSha -notmatch '^[0-9a-fA-F]{40}$') { throw 'ControllerSha must be a full Git SHA.' }\n",
          )
          replace_once(
              script,
              "    if (-not [string]::Equals($remoteSha, $ValidatedEventSha, [StringComparison]::OrdinalIgnoreCase)) {\n        throw \"The remote release branch '$Branch' advanced from the validated event SHA.\"\n    }",
              "    if (-not [string]::Equals($remoteSha, $ControllerSha, [StringComparison]::OrdinalIgnoreCase)) {\n        throw \"The remote release branch '$Branch' advanced from the controller SHA.\"\n    }",
          )
          replace_once(
              script,
              "$run = Select-PureBaseReleaseValidationRun -Runs (Get-WorkflowRuns) -HeadSha $ValidatedEventSha -Branch $Branch -WorkflowPath '.github/workflows/release-validation.yml'\n",
              "$validationRuns = @(Get-WorkflowRuns)\nif ($validationRuns.Count -eq 0) { throw \"No release validation workflow runs were found for release target SHA '$ValidatedEventSha' on branch '$Branch'.\" }\n$run = Select-PureBaseReleaseValidationRun -Runs $validationRuns -HeadSha $ValidatedEventSha -Branch $Branch -WorkflowPath '.github/workflows/release-validation.yml'\n",
          )

          workspace = expr('github.workspace')
          replace_once(
              workflow,
              f"  PACKAGE_ROOT: {workspace}\\PureBaseCi\\Packages\\jp.penguin.purebase\n",
              f"  CONTROLLER_ROOT: {workspace}\\PureBaseController\n  PACKAGE_ROOT: {workspace}\\PureBaseCi\\Packages\\jp.penguin.purebase\n",
          )

          github_sha = expr('github.sha')
          input_version = expr('inputs.version')
          input_resume = expr('inputs.resume')
          release_token = expr('steps.release-app-token.outputs.token')
          release_target_sha = expr('steps.release-target.outputs.release_sha')

          new_checkout_block = f'''      - name: Checkout release controller
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                  ref: {github_sha}
                  path: PureBaseController
                  fetch-depth: 0
                  fetch-tags: true
                  token: {release_token}
                  persist-credentials: false

              - name: Resolve release target SHA
                id: release-target
                shell: pwsh
                env:
                  CONFIRMED_VERSION: {input_version}
                  RESUME_RELEASE: {input_resume}
                run: |
                  $modulePath = Join-Path $env:CONTROLLER_ROOT '.github/scripts/PureBase.Automation.psm1'
                  Import-Module $modulePath -Force
                  $version = (ConvertTo-PureBaseSemVer -Value $env:CONFIRMED_VERSION).original
                  $releaseSha = '{github_sha}'
                  if ($env:RESUME_RELEASE -eq 'true') {{
                    $tagRef = "refs/tags/$version"
                    $releaseSha = (& git -C $env:CONTROLLER_ROOT rev-parse --verify "$tagRef^{{commit}}" | Out-String).Trim()
                    if ($LASTEXITCODE -ne 0 -or $releaseSha -notmatch '^[0-9a-fA-F]{{40}}$') {{
                      throw "Resume requires existing tag '$version' to resolve to a commit."
                    }}
                  }}
                  "release_sha=$($releaseSha.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

              - name: Checkout exact release target SHA
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                  ref: {release_target_sha}
                  path: PureBaseCi/Packages/jp.penguin.purebase
                  fetch-depth: 0
                  fetch-tags: true
                  token: {release_token}
                  persist-credentials: false

          '''
          sub_once(
              workflow,
              r"^      - name: Checkout exact dispatch SHA\n.*?(?=^      - name: Promote validated artifact release\n)",
              new_checkout_block,
          )

          replace_once(
              workflow,
              f'''          & "$env:PACKAGE_ROOT/.github/scripts/Invoke-PureBaseRelease.ps1" `
                    -PackageRoot $env:PACKAGE_ROOT `
                    -ValidatedEventSha '{github_sha}' `
          ''',
              f'''          & "$env:CONTROLLER_ROOT/.github/scripts/Invoke-PureBaseRelease.ps1" `
                    -PackageRoot $env:PACKAGE_ROOT `
                    -ValidatedEventSha '{release_target_sha}' `
                    -ControllerSha '{github_sha}' `
          ''',
          )

          new_checkout_test = r'''    It 'separates the trusted controller checkout from the exact release target checkout' {
                  $releaseJob = Get-NamedJobBlock -Workflow $releasePublishingWorkflow -Name 'release'
                  $controllerCheckout = Get-NamedStepBlock -Job $releaseJob -Name 'Checkout release controller'
                  $targetResolver = Get-NamedStepBlock -Job $releaseJob -Name 'Resolve release target SHA'
                  $targetCheckout = Get-NamedStepBlock -Job $releaseJob -Name 'Checkout exact release target SHA'
                  $checkouts = @([regex]::Matches($releaseJob, '(?ms)^      - name: [^\r\n]*Checkout[^\r\n]*\n.*?(?=^      - name:|\z)') | ForEach-Object Value)

                  $checkouts.Count | Should -Be 2
                  foreach ($checkout in @($controllerCheckout, $targetCheckout)) {
                      $checkout | Should -Match '(?m)^        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1(?: #.*)?$'
                      $checkout | Should -Match '(?m)^          fetch-depth: 0$'
                      $checkout | Should -Match '(?m)^          fetch-tags: true$'
                      $checkout | Should -Match '(?m)^          token: \$\{\{ steps\.release-app-token\.outputs\.token \}\}$'
                      $checkout | Should -Match '(?m)^          persist-credentials: false$'
                  }
                  $controllerCheckout | Should -Match '(?m)^          ref: \$\{\{ github\.sha \}\}$'
                  $controllerCheckout | Should -Match '(?m)^          path: PureBaseController$'
                  $targetResolver | Should -Match 'ConvertTo-PureBaseSemVer'
                  $targetResolver | Should -Match 'refs/tags/\$version'
                  $targetResolver | Should -Match 'rev-parse --verify "\$tagRef\^\{commit\}"'
                  $targetResolver | Should -Match '(?m)^          "release_sha=\$\(\$releaseSha\.ToLowerInvariant\(\)\)"'
                  $targetCheckout | Should -Match '(?m)^          ref: \$\{\{ steps\.release-target\.outputs\.release_sha \}\}$'
                  $targetCheckout | Should -Match '(?m)^          path: PureBaseCi/Packages/jp\.penguin\.purebase$'
              }

          '''
          sub_once(
              contracts,
              r"^    It 'checks out the exact dispatch SHA without persisting the promotion credential' \{.*?(?=^    It 'supports an optional no-mutation preflight and repeated release-branch tip checks' \{)",
              new_checkout_test,
          )
          replace_once(
              contracts,
              "        $releaseInvocation | Should -Match '(?m)^            -ValidatedEventSha ''\\$\\{\\{ github\\.sha \\}\\}'' `$'\n",
              "        $releaseInvocation | Should -Match '(?m)^          & \"\\$env:CONTROLLER_ROOT/\\.github/scripts/Invoke-PureBaseRelease\\.ps1\" `$'\n        $releaseInvocation | Should -Match '(?m)^            -ValidatedEventSha ''\\$\\{\\{ steps\\.release-target\\.outputs\\.release_sha \\}\\}'' `$'\n        $releaseInvocation | Should -Match '(?m)^            -ControllerSha ''\\$\\{\\{ github\\.sha \\}\\}'' `$'\n",
          )
          replace_once(
              contracts,
              "        $releaseAutomationScript | Should -Match '(?m)\\[switch\\]\\$PreflightOnly'\n",
              "        $releaseAutomationScript | Should -Match '(?m)\\[string\\]\\$ControllerSha'\n        $releaseAutomationScript | Should -Match '(?m)\\[switch\\]\\$PreflightOnly'\n        $releaseAutomationScript | Should -Match '(?m)Equals\\(\\$remoteSha, \\$ControllerSha'\n        $releaseAutomationScript | Should -Match 'No release validation workflow runs were found for release target SHA'\n",
          )

          replace_once(
              tests,
              "                [switch]$CanonicalReleaseUnavailableAfterCreation\n",
              "                [switch]$CanonicalReleaseUnavailableAfterCreation,\n                [switch]$ControllerAhead,\n                [switch]$ValidationRunsUnavailable\n",
          )
          replace_once(
              tests,
              '''                if ($AdvanceBranchBeforeRelease) {
                          & $advanceRemoteBranch
                      }

                      $previousReleaseToken = $env:PUREBASE_RELEASE_TOKEN
          ''',
              '''                if ($AdvanceBranchBeforeRelease) {
                          & $advanceRemoteBranch
                      }
                  $controllerSha = $eventSha
                  if ($ControllerAhead) {
                      & $advanceRemoteBranch
                      $controllerSha = (& git -C $remoteRoot rev-parse refs/heads/master).Trim()
                  }

                      $previousReleaseToken = $env:PUREBASE_RELEASE_TOKEN
          ''',
          )
          sub_once(
              tests,
              r"^                    if \(\$Uri -match '/actions/workflows/release-validation\\\.yml/runs'\) \{.*?(?=^                    if \(\$Uri -match '/actions/runs/11/artifacts'\) \{)",
              '''                    if ($Uri -match '/actions/workflows/release-validation\\.yml/runs') {
                          $operationLog.Add([pscustomobject]@{ Kind = 'validation-run'; Boundary = ''; ApiCall = $apiCall }) | Out-Null
                          $apiCall.StateAfter = Get-ValidatedArtifactReleaseState -Release $release -AssetName $assetName
                          $workflowRuns = if ($ValidationRunsUnavailable) {
                              @()
                          }
                          else {
                              @([pscustomobject]@{
                                      id = 11; path = '.github/workflows/release-validation.yml'; head_sha = $eventSha; head_branch = 'master'
                                      event = 'workflow_dispatch'; run_number = 11; run_attempt = 2; status = 'completed'; conclusion = 'success'
                                  })
                          }
                          return [pscustomobject]@{ workflow_runs = $workflowRuns }
                      }
          ''',
          )
          replace_once(
              tests,
              "                        PackageRoot = $packageRoot; ValidatedEventSha = $eventSha\n",
              "                        PackageRoot = $packageRoot; ValidatedEventSha = $eventSha; ControllerSha = $controllerSha\n",
          )
          replace_once(
              tests,
              "                    Failure = $failure; ApiCalls = $apiCalls.ToArray(); RemoteRoot = $remoteRoot; InitialBranchSha = $initialBranchSha\n",
              "                    Failure = $failure; ApiCalls = $apiCalls.ToArray(); RemoteRoot = $remoteRoot; InitialBranchSha = $initialBranchSha; ControllerSha = $controllerSha\n",
          )

          insertion = '''
              It 'resumes a validated tag target while the trusted controller branch is newer' {
                  $fixture = New-ValidatedArtifactReleaseFixture -ReleaseState 'draft-resume' -DraftAssetState 'matching' -ControllerAhead
                  try {
                      $fixture.Failure | Should -BeNullOrEmpty
                      $fixture.ControllerSha | Should -Not -Be $fixture.EventSha
                      (& git -C $fixture.RemoteRoot rev-parse refs/heads/master).Trim() | Should -Be $fixture.ControllerSha
                      (& git -C $fixture.RemoteRoot rev-parse "refs/tags/$($fixture.Version)^{commit}").Trim() | Should -Be $fixture.EventSha
                      $fixture.Release.draft | Should -BeFalse
                      $fixture.Release.immutable | Should -BeTrue
                      $fixture.DispatchPayloads.Count | Should -Be 1
                  }
                  finally { Remove-ValidatedArtifactReleaseFixture -Fixture $fixture }
              }

              It 'fails clearly when no validation run exists for the release target SHA' {
                  $fixture = New-ValidatedArtifactReleaseFixture -ValidationRunsUnavailable
                  try {
                      $fixture.Failure | Should -Not -BeNullOrEmpty
                      $fixture.Failure.Exception.Message | Should -Match "No release validation workflow runs were found for release target SHA '$($fixture.EventSha)'"
                      $fixture.MutationBoundaries.Count | Should -Be 0
                      @($fixture.ApiCalls | Where-Object { $_.Method -in @('POST', 'PATCH', 'DELETE') }).Count | Should -Be 0
                  }
                  finally { Remove-ValidatedArtifactReleaseFixture -Fixture $fixture }
              }
          '''
          marker = "    It 'requires the production runner checkout to be detached at the validated event SHA' -ForEach @(\n"
          replace_once(tests, marker, insertion + "\n" + marker)

      - name: Restore normal automation workflow
        shell: bash
        run: git show origin/master:.github/workflows/automation-tests.yml > .github/workflows/automation-tests.yml

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.9.0 -Scope CurrentUser -Force

      - name: Run automation tests
        shell: pwsh
        run: |
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = '.github/tests'
          $configuration.Run.Exit = $true
          $configuration.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $configuration

      - name: Run actionlint
        shell: bash
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

      - name: Commit and push fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/scripts/Invoke-PureBaseRelease.ps1 .github/workflows/release.yml .github/tests/HostedUnityReviewContracts.Tests.ps1 .github/tests/PureBase.Automation.Tests.ps1 .github/workflows/automation-tests.yml
          git commit -m "Fix resume release target selection"
          git push origin HEAD:agent/fix-resume-release-target
