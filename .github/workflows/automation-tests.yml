name: Apply draft release fix

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Checkout fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Apply source and test changes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="")

          script = Path('.github/scripts/Invoke-PureBaseRelease.ps1')
          tests = Path('.github/tests/PureBase.Automation.Tests.ps1')

          get_release = '''function Get-Release([string]$Version) {
              try { return Invoke-Api GET "$apiRoot/repos/$Repository/releases/tags/$([Uri]::EscapeDataString($Version))" $releaseToken }
              catch { if ($_.Exception.Data['StatusCode'] -ne 404) { throw } }
              $releases = @(Invoke-Api GET "$apiRoot/repos/$Repository/releases?per_page=100" $releaseToken)
              if ($releases.Count -eq 1 -and $releases[0] -is [object[]]) { $releases = $releases[0] }
              $releaseCandidates = @($releases | Where-Object { $null -ne $_ -and [string]$_.tag_name -ceq $Version } | Select-Object -First 1)
              if ($releaseCandidates.Count -eq 0) { return $null }
              return $releaseCandidates[0]
          }
          '''
          replace_once(script, get_release, get_release + '''
          function Get-ReleaseById([long]$ReleaseId, [int]$MaximumAttempts = 4) {
              if ($ReleaseId -le 0) { throw 'Release ID must be positive.' }
              if ($MaximumAttempts -le 0) { throw 'MaximumAttempts must be positive.' }
              for ($attempt = 1; $attempt -le $MaximumAttempts; $attempt++) {
                  try { return Invoke-Api GET "$apiRoot/repos/$Repository/releases/$ReleaseId" $releaseToken }
                  catch {
                      if ($_.Exception.Data['StatusCode'] -ne 404) { throw }
                      if ($attempt -eq $MaximumAttempts) { return $null }
                      Start-Sleep -Milliseconds (100 * $attempt)
                  }
              }
              return $null
          }
          ''')

          replace_once(script, '''if ($null -eq $release) {
              Invoke-MutationGate 'draft-create'
              Invoke-Api POST "$apiRoot/repos/$Repository/releases" $releaseToken ([ordered]@{ tag_name = $ConfirmedVersion; target_commitish = $ValidatedEventSha; name = $ConfirmedVersion; body = $badge; draft = $true; prerelease = [bool]$releaseMode.PrereleaseKind; generate_release_notes = $true }) | Out-Null
              $release = Get-Release $ConfirmedVersion
              if ($null -eq $release) { throw "Created draft release '$ConfirmedVersion' could not be re-read before asset processing." }
          }
          ''', '''if ($null -eq $release) {
              Invoke-MutationGate 'draft-create'
              $createdRelease = Invoke-Api POST "$apiRoot/repos/$Repository/releases" $releaseToken ([ordered]@{ tag_name = $ConfirmedVersion; target_commitish = $ValidatedEventSha; name = $ConfirmedVersion; body = $badge; draft = $true; prerelease = [bool]$releaseMode.PrereleaseKind; generate_release_notes = $true })
              if ($null -eq $createdRelease -or $null -eq $createdRelease.PSObject.Properties['id'] -or [long]$createdRelease.id -le 0) {
                  throw "Created draft release '$ConfirmedVersion' returned no valid release ID."
              }
              $release = Get-ReleaseById -ReleaseId ([long]$createdRelease.id)
              if ($null -eq $release) { throw "Created draft release '$ConfirmedVersion' could not be re-read by ID before asset processing." }
          }
          ''')

          replace_once(script, '''if ([bool]$release.draft) {
              $assetAction = Resolve-PureBaseDraftAssetAction -Assets @($release.assets) -AssetName $artifact.Name -Sha256 $artifact.Sha256
              if ($assetAction -eq 'upload') {
                  Invoke-MutationGate 'asset-upload'
                  $uploadUri = (([string]$release.upload_url) -replace '\\{\\?name,label\\}$', '') + '?name=' + [Uri]::EscapeDataString($artifact.Name)
                  Invoke-Api POST $uploadUri $releaseToken $null $artifact.Path | Out-Null
              }
              $release = Get-Release $ConfirmedVersion
              [void](Resolve-PureBaseDraftAssetAction -Assets @($release.assets) -AssetName $artifact.Name -Sha256 $artifact.Sha256)
          ''', '''if ([bool]$release.draft) {
              $releaseId = [long]$release.id
              $assetAction = Resolve-PureBaseDraftAssetAction -Assets @($release.assets) -AssetName $artifact.Name -Sha256 $artifact.Sha256
              if ($assetAction -eq 'upload') {
                  Invoke-MutationGate 'asset-upload'
                  $uploadUri = (([string]$release.upload_url) -replace '\\{\\?name,label\\}$', '') + '?name=' + [Uri]::EscapeDataString($artifact.Name)
                  Invoke-Api POST $uploadUri $releaseToken $null $artifact.Path | Out-Null
              }
              $release = Get-ReleaseById -ReleaseId $releaseId
              if ($null -eq $release) { throw "Draft release '$ConfirmedVersion' could not be re-read by ID after asset processing." }
              [void](Resolve-PureBaseDraftAssetAction -Assets @($release.assets) -AssetName $artifact.Name -Sha256 $artifact.Sha256)
          ''')

          marker = "                    if ($Uri -match '/releases/tags/') {\n"
          replace_once(tests, marker, '''                    if ($Method -eq 'GET' -and $Uri -eq 'https://api.example.invalid/repos/test/Pure-Base/releases/42') {
                          if ($null -ne $canonicalRelease.Value -and -not $CanonicalReleaseUnavailableAfterCreation) {
                              $apiCall.StateAfter = Get-ValidatedArtifactReleaseState -Release $canonicalRelease.Value -AssetName $assetName
                              return $canonicalRelease.Value
                          }
                          $exception = [InvalidOperationException]::new('Not Found')
                          $exception | Add-Member -NotePropertyName Response -NotePropertyValue ([pscustomobject]@{ StatusCode = 404 })
                          throw $exception
                      }
          ''' + marker)
          replace_once(tests, "It 're-fetches canonical draft data after an assets-less create response before asset processing'", "It 're-fetches canonical draft data by release ID after an assets-less create response'")
          replace_once(tests, '''$call.Method -eq 'GET' -and $call.Uri -eq "https://api.example.invalid/repos/test/Pure-Base/releases/tags/$($fixture.Version)"''', "$call.Method -eq 'GET' -and $call.Uri -eq 'https://api.example.invalid/repos/test/Pure-Base/releases/42'")
          replace_once(tests, "It 'fails before asset processing when a created draft cannot be re-read canonically'", "It 'fails closed when a created draft cannot be re-read by release ID'")
          replace_once(tests, "Created draft release.*could not be re-read before asset processing", "Created draft release.*could not be re-read by ID before asset processing")
          replace_once(tests, "$call.Method -eq 'GET' -and $call.Uri -match '/releases/tags/' -and $call.AssetDigest", "$call.Method -eq 'GET' -and $call.Uri -match '/releases/42$' -and $call.AssetDigest")

      - name: Restore normal automation workflow
        shell: bash
        run: git show origin/master:.github/workflows/automation-tests.yml > .github/workflows/automation-tests.yml

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.9.0 -Scope CurrentUser -Force

      - name: Run automation tests
        shell: pwsh
        run: |
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = '.github/tests'
          $configuration.Run.Exit = $true
          $configuration.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $configuration

      - name: Commit and push fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/scripts/Invoke-PureBaseRelease.ps1 .github/tests/PureBase.Automation.Tests.ps1 .github/workflows/automation-tests.yml
          git commit -m "Fix draft release reread"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
