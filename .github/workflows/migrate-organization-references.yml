name: Migrate organization references

on:
  push:
    branches:
      - agent/update-organization-references

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/update-organization-references
          fetch-depth: 0

      - name: Replace legacy organization references
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          old = "Penguin" + "DOOM"
          new = "Penguin-Repository"
          workflow = Path(".github/workflows/migrate-organization-references.yml")
          changed = []
          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          for value in paths:
              if not value:
                  continue
              path = Path(value)
              if path == workflow:
                  continue
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              updated = text.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8", newline="")
                  changed.append(value)
          print("Updated files:")
          print("\n".join(changed))
          if not changed:
              raise SystemExit("No legacy organization references were found.")

      - name: Verify no legacy references remain
        shell: bash
        run: |
          old="Penguin""DOOM"
          if git grep -n -F "$old" -- ':!.github/workflows/migrate-organization-references.yml'; then
            echo "Legacy references remain."
            exit 1
          fi

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.9.0 -Scope CurrentUser -Force

      - name: Run automation tests
        shell: pwsh
        run: |
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = '.github/tests'
          $configuration.Run.Exit = $true
          $configuration.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $configuration

      - name: Remove migration workflow and commit
        shell: bash
        run: |
          git rm -- .github/workflows/migrate-organization-references.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update organization references"
          git push origin HEAD:agent/update-organization-references
