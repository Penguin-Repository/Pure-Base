name: Release validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pure-base-release-validation
  cancel-in-progress: false

env:
  GIT_CONFIG_COUNT: 2
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
  GIT_CONFIG_KEY_1: core.eol
  GIT_CONFIG_VALUE_1: lf
  SOURCE_PROJECT_ROOT: ${{ github.workspace }}\PureBaseSource
  PACKAGE_ROOT: ${{ github.workspace }}\PureBaseSource\Packages\jp.penguin.purebase
  CI_PROJECT_ROOT: ${{ github.workspace }}\PureBaseCi
  UNITY_PACKAGE_ROOT: ${{ github.workspace }}\PureBaseCi\Packages\jp.penguin.purebase
  UNITY_SHADER_CORE_ROOT: ${{ github.workspace }}\PureBaseCi\Packages\jp.lilxyzw.shadercore

jobs:
  unity-editor-cache:
    name: Prepare Unity 2022.3.22f1 cache
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout cache lookup helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Look up Unity Editor cache
        id: unity-cache-lookup
        uses: ./.github/actions/lookup-unity-editor-cache
        with:
          unity-version: "2022.3.22f1"
          cli-version: "1.0.0-beta.3"
          cli-sha256: "ff9ef81ade1063041d25e2c549cc7ed14e96d446f4204400bf101b389f7b8502"

      - name: Restore or create Unity Editor cache
        id: unity
        if: steps.unity-cache-lookup.outputs.cache-hit != 'true'
        uses: yamachu/unity-cli-actions/setup-unity-cli@e0f32f7e273329bbe99af5bf5809bf1056935556
        with:
          unity-version: "2022.3.22f1"
          cli-version: "1.0.0-beta.3"
          cli-channel: beta
          cache: "true"

      - name: Report Unity Editor cache status
        shell: pwsh
        run: |
          if ("${{ steps.unity-cache-lookup.outputs.cache-hit }}" -eq "true") {
            "Unity Editor cache metadata lookup hit for 2022.3.22f1; this preparation job did not download, extract, or install the Editor." >> $env:GITHUB_STEP_SUMMARY
          }
          else {
            "Unity Editor cache metadata lookup missed; setup-unity-cli ran to restore or install the Editor, and a newly installed Editor will be saved when this job completes." >> $env:GITHUB_STEP_SUMMARY
          }

  validate:
    name: Validate audited release package
    needs: unity-editor-cache
    concurrency:
      group: pure-base-unity-personal-license
      cancel-in-progress: false
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - name: Initialize artifact root
        shell: pwsh
        run: |
          "ARTIFACT_ROOT=${{ runner.temp }}\PureBase-Release-Validation-${{ github.run_id }}-${{ github.run_attempt }}" >> $env:GITHUB_ENV

      - name: Checkout Pure-Base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: PureBaseSource\Packages\jp.penguin.purebase
          fetch-depth: 0
          persist-credentials: false

      - name: Capture initial repository state
        shell: pwsh
        run: |
          Push-Location $env:PACKAGE_ROOT
          try {
            $initialHead = (& git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'git rev-parse HEAD failed.' }
            $initialCleanTree = (& git status --porcelain --untracked-files=all | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'git status --porcelain failed.' }
            $initialLocalBranch = (& git branch --show-current | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'git branch --show-current failed.' }
            $initialLocalRefs = (& git for-each-ref --format='%(refname) %(objectname)' refs/heads refs/tags | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'git for-each-ref failed.' }
          }
          finally {
            Pop-Location
          }
          $snapshot = [ordered]@{
            head = $initialHead
            cleanTree = $initialCleanTree
            localBranch = $initialLocalBranch
            localRefs = $initialLocalRefs
          }
          if ([string]::IsNullOrWhiteSpace($snapshot.head)) { throw 'Initial repository HEAD snapshot is empty.' }
          if (-not [string]::IsNullOrEmpty($snapshot.cleanTree)) { throw 'Release validation checkout must start clean.' }

          New-Item -ItemType Directory -Path $env:ARTIFACT_ROOT -Force | Out-Null
          [IO.File]::WriteAllText(
            (Join-Path $env:ARTIFACT_ROOT 'repository-state.json'),
            (($snapshot | ConvertTo-Json -Compress) + "`n"),
            [Text.UTF8Encoding]::new($false)
          )

      - name: Install verified Shader-Core 0.1.9 release
        shell: pwsh
        run: |
          & "$env:PACKAGE_ROOT/.github/scripts/Install-VerifiedShaderCoreRelease.ps1" `
            -ProjectRoot $env:SOURCE_PROJECT_ROOT `
            -Uri 'https://github.com/lilxyzw/Shader-Core/releases/download/0.1.9/jp.lilxyzw.shadercore-0.1.9.zip' `
            -ExpectedSha256 'fe303273fd653a44d2dc1b746cec587c07fcec3e2777409549b71a2ed742f5ed'

      - name: Restore Unity 2022.3.22f1
        id: unity
        uses: yamachu/unity-cli-actions/setup-unity-cli@e0f32f7e273329bbe99af5bf5809bf1056935556
        with:
          unity-version: "2022.3.22f1"
          cli-version: "1.0.0-beta.3"
          cli-channel: beta
          cache: "true"

      - name: Report Unity Editor cache handoff
        shell: pwsh
        run: |
          if ("${{ steps.unity.outputs.cache-hit }}" -eq "true") {
            "Unity Editor cache handoff succeeded." >> $env:GITHUB_STEP_SUMMARY
          }
          else {
            "Unity Editor cache handoff missed; setup-unity-cli installed/restored the Editor in this job, so validation will continue." >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Activate Unity Personal license
        id: unity_license
        continue-on-error: true
        uses: buildalon/activate-unity-license@e0d245d0787b7b9931b56ccbde3b508f6b70f1af # v2.2.2
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}
          license-version: "6.x"

      - name: Wait before retrying Unity license activation
        if: steps.unity_license.outcome == 'failure'
        shell: pwsh
        run: Start-Sleep -Seconds 45

      - name: Retry Unity Personal license activation
        if: steps.unity_license.outcome == 'failure'
        uses: buildalon/activate-unity-license@e0d245d0787b7b9931b56ccbde3b508f6b70f1af # v2.2.2
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}
          license-version: "6.x"

      - name: Export Unity editor paths
        shell: pwsh
        run: |
          $realEditorPathFile = Join-Path $env:RUNNER_TEMP 'PureBase.RealUnityEditorPath.txt'
          $watchdogEditorPath = & "$env:PACKAGE_ROOT/.github/scripts/Resolve-UnityEditorPath.ps1" `
            -EditorPath '${{ steps.unity.outputs.editor-path }}' `
            -RealEditorPathOutputFile $realEditorPathFile
          $realEditorPath = (Get-Content -LiteralPath $realEditorPathFile -Raw).Trim()
          "UNITY_EDITOR_PATH=$watchdogEditorPath" >> $env:GITHUB_ENV
          "REAL_UNITY_EDITOR_PATH=$realEditorPath" >> $env:GITHUB_ENV
          "Configure Unity watchdog path: $watchdogEditorPath" >> $env:GITHUB_STEP_SUMMARY
          "Release validation Unity.exe path: $realEditorPath" >> $env:GITHUB_STEP_SUMMARY

      - name: Prepare Unity project shell
        shell: pwsh
        run: |
          $sourceShaderCoreRoot = Join-Path $env:SOURCE_PROJECT_ROOT 'Packages/jp.lilxyzw.shadercore'
          New-Item -ItemType Directory -Path (Split-Path -Parent $env:UNITY_PACKAGE_ROOT) -Force | Out-Null
          $null = & robocopy $env:PACKAGE_ROOT $env:UNITY_PACKAGE_ROOT /MIR /XD .git /NFL /NDL /NJH /NJS /NP
          $packageCopyExitCode = $LASTEXITCODE
          if ($packageCopyExitCode -ge 8) {
            throw "Failed to stage the disposable Pure Base package copy; robocopy exited with code $packageCopyExitCode."
          }
          $null = & robocopy $sourceShaderCoreRoot $env:UNITY_SHADER_CORE_ROOT /MIR /NFL /NDL /NJH /NJS /NP
          $shaderCoreCopyExitCode = $LASTEXITCODE
          if ($shaderCoreCopyExitCode -ge 8) {
            throw "Failed to stage the disposable Shader-Core package copy; robocopy exited with code $shaderCoreCopyExitCode."
          }
          & "$env:UNITY_PACKAGE_ROOT/.github/scripts/New-PureBaseCiProject.ps1" `
            -ProjectRoot $env:CI_PROJECT_ROOT

      - name: Run release validation
        shell: pwsh
        run: |
          & "$env:PACKAGE_ROOT/Tests/Release/Run-PureBaseReleaseValidation.ps1" `
            -UnityEditorPath $env:REAL_UNITY_EDITOR_PATH `
            -ArtifactDirectory $env:ARTIFACT_ROOT

      - name: Configure Unity project
        timeout-minutes: 30
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:ARTIFACT_ROOT -Force | Out-Null
          $logPath = Join-Path $env:ARTIFACT_ROOT 'Configure.Unity.log'
          & $env:UNITY_EDITOR_PATH `
            -batchmode `
            -nographics `
            -accept-apiupdate `
            -projectPath $env:CI_PROJECT_ROOT `
            -executeMethod PureBase.Tests.Regeneration.PureBaseCiProjectInitializer.InitializeForBatchMode `
            -logFile $logPath
          $unityExitCode = $LASTEXITCODE
          if (Test-Path -LiteralPath $logPath) {
            Get-Content -LiteralPath $logPath -Tail 300 | Out-Host
          }
          if ($unityExitCode -ne 0) {
            throw "Unity project configuration failed with exit code $unityExitCode. Unity log: '$logPath'."
          }

      - name: Export versioned validation ZIP
        if: success()
        shell: pwsh
        run: |
          & "$env:PACKAGE_ROOT/.github/scripts/Export-PureBaseValidationZip.ps1" `
            -PackageRoot $env:PACKAGE_ROOT `
            -ValidationArtifactDirectory $env:ARTIFACT_ROOT `
            -Repository '${{ github.repository }}' `
            -HeadSha '${{ github.sha }}' `
            -HeadBranch '${{ github.ref_name }}' `
            -WorkflowRunId '${{ github.run_id }}' `
            -WorkflowRunAttempt '${{ github.run_attempt }}'

      - name: Assert repository state unchanged
        if: always()
        shell: pwsh
        run: |
          $snapshotPath = Join-Path $env:ARTIFACT_ROOT 'repository-state.json'
          if (-not (Test-Path -LiteralPath $snapshotPath -PathType Leaf)) {
            throw "Initial repository state snapshot is missing: '$snapshotPath'."
          }
          $snapshot = Get-Content -LiteralPath $snapshotPath -Raw | ConvertFrom-Json

          Push-Location $env:PACKAGE_ROOT
          try {
            $finalHead = (& git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'git rev-parse HEAD failed.' }
            $finalCleanTree = (& git status --porcelain --untracked-files=all | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'git status --porcelain failed.' }
            $finalLocalBranch = (& git branch --show-current | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'git branch --show-current failed.' }
            $finalLocalRefs = (& git for-each-ref --format='%(refname) %(objectname)' refs/heads refs/tags | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'git for-each-ref failed.' }
            if (-not [string]::IsNullOrEmpty($finalCleanTree)) {
              Write-Host 'Repository working tree changes:'
              Write-Host $finalCleanTree
              & git diff --no-ext-diff --text | Out-Host
            }
          }
          finally {
            Pop-Location
          }
          if ($finalHead -cne [string]$snapshot.head) { throw "Repository HEAD changed from '$($snapshot.head)' to '$finalHead'." }
          if ($finalCleanTree -cne [string]$snapshot.cleanTree -or -not [string]::IsNullOrEmpty($finalCleanTree)) { throw 'Release validation changed the repository working tree.' }
          if ($finalLocalBranch -cne [string]$snapshot.localBranch) { throw "Local branch changed from '$($snapshot.localBranch)' to '$finalLocalBranch'." }
          if ($finalLocalRefs -cne [string]$snapshot.localRefs) { throw 'Local branch or tag refs changed during release validation.' }

      - name: Upload release validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pure-base-release-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\PureBase-Release-Validation-${{ github.run_id }}-${{ github.run_attempt }}\validated-package
            ${{ runner.temp }}\PureBase-Release-Validation-${{ github.run_id }}-${{ github.run_attempt }}\repository-state.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  notify:
    name: Notify Discord
    if: ${{ always() }}
    needs:
      - unity-editor-cache
      - validate
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve workflow status
        id: workflow_status
        shell: bash
        env:
          CACHE_RESULT: ${{ needs.unity-editor-cache.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          if [[ "$CACHE_RESULT" == "failure" || "$VALIDATE_RESULT" == "failure" ]]; then
            status=Failure
          elif [[ "$CACHE_RESULT" == "cancelled" || "$VALIDATE_RESULT" == "cancelled" ]]; then
            status=Cancelled
          elif [[ "$CACHE_RESULT" == "skipped" || "$VALIDATE_RESULT" == "skipped" ]]; then
            status=Failure
          else
            status=Success
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Report workflow status to Discord
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ steps.workflow_status.outputs.status }}
          title: "Release Validation"
          description: >-
            ${{ steps.workflow_status.outputs.status == 'Success'
                && 'The release is approaching'
                || steps.workflow_status.outputs.status == 'Failure'
                && 'Release validation failed'
                || steps.workflow_status.outputs.status == 'Cancelled'
                && 'Release validation was cancelled' }}
          url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          username: "Pure Base CI"
