name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Confirm exact version from the checked-out package.json
        required: true
        type: string
      resume:
        description: Resume only for an exact annotated tag and matching draft or published Release at the same SHA
        required: false
        default: false
        type: boolean
      preflight_only:
        description: Check the validated artifact and release state without mutating GitHub
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: pure-base-release
  cancel-in-progress: false

env:
  AUTHORIZED_RELEASE_ACTOR_ID: "50603637"
  GIT_CONFIG_COUNT: 2
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
  GIT_CONFIG_KEY_1: core.eol
  GIT_CONFIG_VALUE_1: lf
  PACKAGE_ROOT: ${{ github.workspace }}\PureBaseCi\Packages\jp.penguin.purebase
  RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH }}
  VPM_REPOSITORY: ${{ vars.VPM_REPOSITORY }}

jobs:
  authorize:
    name: Verify release initiator
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Penguin release dispatch
        shell: pwsh
        env:
          ACTOR_LOGIN: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR_LOGIN: ${{ github.triggering_actor }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if ($env:EVENT_NAME -cne 'workflow_dispatch') {
            throw "Release requires workflow_dispatch; received '$env:EVENT_NAME'."
          }
          if ($env:ACTOR_ID -cne $env:AUTHORIZED_RELEASE_ACTOR_ID) {
            throw "GitHub actor '$env:ACTOR_LOGIN' (ID $env:ACTOR_ID) is not authorized to publish Pure Base releases."
          }
          if ($env:RUN_ATTEMPT -cne '1') {
            throw 'Release workflow re-runs are not authorized. Start a new workflow_dispatch and use resume=true when recovering a partial release.'
          }
          if ($env:ACTOR_LOGIN -cne $env:TRIGGERING_ACTOR_LOGIN) {
            throw "The triggering actor '$env:TRIGGERING_ACTOR_LOGIN' does not match the original actor '$env:ACTOR_LOGIN'."
          }

  release:
    name: Publish immutable release
    needs: authorize
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    environment: release
    concurrency:
      group: pure-base-release-publishing
      cancel-in-progress: false
    runs-on: windows-2022
    timeout-minutes: 480
    steps:
      - name: Revalidate release initiator
        shell: pwsh
        env:
          ACTOR_LOGIN: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR_LOGIN: ${{ github.triggering_actor }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if ($env:EVENT_NAME -cne 'workflow_dispatch') {
            throw "Release requires workflow_dispatch; received '$env:EVENT_NAME'."
          }
          if ($env:ACTOR_ID -cne $env:AUTHORIZED_RELEASE_ACTOR_ID) {
            throw "GitHub actor '$env:ACTOR_LOGIN' (ID $env:ACTOR_ID) is not authorized to publish Pure Base releases."
          }
          if ($env:RUN_ATTEMPT -cne '1') {
            throw 'Release workflow re-runs are not authorized. Start a new workflow_dispatch and use resume=true when recovering a partial release.'
          }
          if ($env:ACTOR_LOGIN -cne $env:TRIGGERING_ACTOR_LOGIN) {
            throw "The triggering actor '$env:TRIGGERING_ACTOR_LOGIN' does not match the original actor '$env:ACTOR_LOGIN'."
          }

      - name: Initialize artifact roots
        shell: pwsh
        run: |
          "RELEASE_ARTIFACT_ROOT=${{ runner.temp }}\PureBase-Release-${{ github.run_id }}-${{ github.run_attempt }}" >> $env:GITHUB_ENV

      - name: Validate release configuration
        id: release-config
        shell: pwsh
        env:
          SELECTED_BRANCH: ${{ github.ref_name }}
          SELECTED_REF_TYPE: ${{ github.ref_type }}
        run: |
          if ($env:SELECTED_REF_TYPE -ne 'branch') {
            throw 'The release workflow must be dispatched from a branch.'
          }
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_BRANCH)) {
            throw 'Repository variable RELEASE_BRANCH must contain the only branch allowed to publish releases.'
          }
          if ($env:SELECTED_BRANCH -ne $env:RELEASE_BRANCH) {
            throw "Selected branch '$env:SELECTED_BRANCH' is not configured release branch '$env:RELEASE_BRANCH'."
          }
          if ($env:VPM_REPOSITORY -notmatch '^[^/]+/[^/]+$') {
            throw 'Repository variable VPM_REPOSITORY must use owner/name form.'
          }
          $vpmOwner, $vpmRepository = $env:VPM_REPOSITORY -split '/', 2
          "vpm_owner=$vpmOwner" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "vpm_repository=$vpmRepository" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create release GitHub App token
        id: release-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-actions: read
          permission-workflows: write
          permission-administration: read

      - name: Create VPM dispatch GitHub App token
        id: dispatch-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.release-config.outputs.vpm_owner }}
          repositories: ${{ steps.release-config.outputs.vpm_repository }}
          permission-contents: write

      - name: Checkout exact dispatch SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: PureBaseCi/Packages/jp.penguin.purebase
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.release-app-token.outputs.token }}
          persist-credentials: false

      - name: Promote validated artifact release
        shell: pwsh
        env:
          PUREBASE_RELEASE_TOKEN: ${{ steps.release-app-token.outputs.token }}
          PUREBASE_DISPATCH_TOKEN: ${{ steps.dispatch-app-token.outputs.token }}
          APP_SLUG: ${{ steps.release-app-token.outputs.app-slug }}
          CONFIRMED_VERSION: ${{ inputs.version }}
          RESUME_RELEASE: ${{ inputs.resume }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
        run: |
          $resume = $env:RESUME_RELEASE -eq 'true'
          $preflightOnly = $env:PREFLIGHT_ONLY -eq 'true'
          & "$env:PACKAGE_ROOT/.github/scripts/Invoke-PureBaseRelease.ps1" `
            -PackageRoot $env:PACKAGE_ROOT `
            -ValidatedEventSha '${{ github.sha }}' `
            -ReleaseArtifactDirectory $env:RELEASE_ARTIFACT_ROOT `
            -Repository '${{ github.repository }}' `
            -Branch $env:RELEASE_BRANCH `
            -ConfirmedVersion $env:CONFIRMED_VERSION `
            -VpmRepository $env:VPM_REPOSITORY `
            -AppSlug $env:APP_SLUG `
            -Resume:$resume `
            -PreflightOnly:$preflightOnly

      - name: Create release authorization predicate
        if: inputs.preflight_only == false
        id: release-authorization
        shell: pwsh
        env:
          ACTOR_LOGIN: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR_LOGIN: ${{ github.triggering_actor }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_REF_NAME: ${{ github.ref_name }}
          DISPATCH_REF_TYPE: ${{ github.ref_type }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          CONFIRMED_VERSION: ${{ inputs.version }}
          RESUME_RELEASE: ${{ inputs.resume }}
        run: |
          $resume = $env:RESUME_RELEASE -eq 'true'
          $predicateJson = & "$env:PACKAGE_ROOT/.github/scripts/Get-ReleaseAuthorizationPredicate.ps1" `
            -ReleaseArtifactRoot $env:RELEASE_ARTIFACT_ROOT `
            -ActorLogin $env:ACTOR_LOGIN `
            -ActorId $env:ACTOR_ID `
            -TriggeringActorLogin $env:TRIGGERING_ACTOR_LOGIN `
            -EventName $env:EVENT_NAME `
            -RunId ([long]$env:RUN_ID) `
            -RunNumber ([long]$env:RUN_NUMBER) `
            -RunAttempt ([int]$env:RUN_ATTEMPT) `
            -Repository $env:REPOSITORY `
            -RepositoryId $env:REPOSITORY_ID `
            -RepositoryOwner $env:REPOSITORY_OWNER `
            -RepositoryOwnerId $env:REPOSITORY_OWNER_ID `
            -DispatchRef $env:DISPATCH_REF `
            -DispatchRefName $env:DISPATCH_REF_NAME `
            -DispatchRefType $env:DISPATCH_REF_TYPE `
            -WorkflowName $env:WORKFLOW_NAME `
            -WorkflowRef $env:WORKFLOW_REF `
            -WorkflowSha $env:WORKFLOW_SHA `
            -ConfirmedVersion $env:CONFIRMED_VERSION `
            -Resume:$resume | Out-String

          $predicatePath = Join-Path $env:RELEASE_ARTIFACT_ROOT 'release-authorization.json'
          [IO.File]::WriteAllText(
            $predicatePath,
            $predicateJson.TrimEnd() + "`n",
            [Text.UTF8Encoding]::new($false)
          )
          $assetName = "jp.penguin.purebase-$env:CONFIRMED_VERSION.zip"
          $subjectPath = Join-Path $env:RELEASE_ARTIFACT_ROOT "validation-artifact\validated-package\$assetName"
          "predicate_path=$predicatePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "subject_path=$subjectPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Attest release authorization
        if: inputs.preflight_only == false
        id: release-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.release-authorization.outputs.subject_path }}
          predicate-type: https://github.com/Penguin-Repository/Pure-Base/attestations/release-authorization/v1
          predicate-path: ${{ steps.release-authorization.outputs.predicate_path }}

      - name: Preserve release attestation bundle
        if: inputs.preflight_only == false
        shell: pwsh
        env:
          ATTESTATION_BUNDLE_PATH: ${{ steps.release-attestation.outputs.bundle-path }}
        run: |
          if (-not (Test-Path -LiteralPath $env:ATTESTATION_BUNDLE_PATH -PathType Leaf)) {
            throw 'Release authorization attestation bundle is missing.'
          }
          Copy-Item `
            -LiteralPath $env:ATTESTATION_BUNDLE_PATH `
            -Destination (Join-Path $env:RELEASE_ARTIFACT_ROOT 'release-authorization.attestation.json') `
            -Force

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pure-base-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\PureBase-Release-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

  notify:
    name: Notify Discord
    if: ${{ always() }}
    needs:
      - authorize
      - release
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - name: Resolve workflow status
        id: workflow_status
        shell: bash
        env:
          AUTHORIZE_RESULT: ${{ needs.authorize.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          if [[ "$AUTHORIZE_RESULT" == "failure" || "$RELEASE_RESULT" == "failure" ]]; then
            status=Failure
          elif [[ "$AUTHORIZE_RESULT" == "cancelled" || "$RELEASE_RESULT" == "cancelled" ]]; then
            status=Cancelled
          elif [[ "$AUTHORIZE_RESULT" == "skipped" || "$RELEASE_RESULT" == "skipped" ]]; then
            status=Failure
          else
            status=Success
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Report workflow status to Discord
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        continue-on-error: true
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        with:
          webhook: ${{ env.DISCORD_WEBHOOK }}
          status: ${{ steps.workflow_status.outputs.status }}
          title: "Release"
          description: |
            Build and deploy to GitHub Releases and VPM repository
            ${{ steps.workflow_status.outputs.status == 'Success'
                && inputs.preflight_only == true
                && 'Release preflight completed successfully. No release was published.'
                || steps.workflow_status.outputs.status == 'Success'
                && 'Release completed successfully.'
                || steps.workflow_status.outputs.status == 'Failure'
                && 'Release failed. Check the logs for details.'
                || steps.workflow_status.outputs.status == 'Cancelled'
                && 'Release was cancelled.'
                || '' }}
            ${{ steps.workflow_status.outputs.status == 'Success'
                && inputs.preflight_only == false
                && 'The release is now available on GitHub and VPM.'
                || '' }}
            ${{ steps.workflow_status.outputs.status == 'Success'
                && inputs.preflight_only == false
                && format('{0}/{1}/releases/tag/{2}', github.server_url, github.repository, inputs.version)
                || '' }}
          url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          username: "Pure Base CI"
          content: >-
            ${{ steps.workflow_status.outputs.status == 'Success'
                && inputs.preflight_only == false
                && '@here Release completed successfully and is now available on GitHub and VPM.'
                || '' }}
