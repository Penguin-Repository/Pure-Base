# Temporary PR-only helper used to retrieve one large source file for a precise connector-backed edit.
name: Source export

on:
  pull_request:
    types:
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Upload regression source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: daily-regression-source-${{ github.event.pull_request.head.sha }}
          path: Tests/Daily/Editor/PureBaseValidationSceneRegressionTests.cs
          if-no-files-found: error
          retention-days: 1
